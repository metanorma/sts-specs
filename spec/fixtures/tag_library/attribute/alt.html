<h1 class="DL1 SL1 attr-info"><span class="attrtag">alt</span>&nbsp;<span class="attrname">Alternative Text</span></h1>
<div class="div2 definition">
<div class="para">Word or phrase that serves as a textual alternative for the element.</div>
</div>
<div class="div2 remarks">
<h2 class="DL2 SL2 header">Usage/Remarks</h2>
<div class="para">Provides a textual alternative for pronouncing screen readers, similar to how <a href="../element/alt-text.html" title="Alt Text"><span class="elementtag">&lt;alt-text&gt;</span></a> works for graphics.</div>
</div>
<details class="div2 attrvalues">
<summary class="DL2 SLX header">OPTIONAL on many elements; click for list</summary>
<div class="para">Used on: <a href="../element/abbrev.html"><span class="elementtag">&lt;abbrev&gt;</span></a>, <a href="../element/label.html"><span class="elementtag">&lt;label&gt;</span></a>.</div>
</details>
</div>
